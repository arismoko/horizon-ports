# radiantgear: Radiant Gear 2.1.6 (Illusive Soulworks, LGPL-3.0-or-later). Worn trinkets that glow
# light up with Horizon Extras' dynamic lights. It reads native/trinkets' `trinkets:worn` player
# attachment and needs none of its code. ITEM_LIGHTS (radiantgear_data.rs) is written by
# tools/trinkets_port.py.
id = "radiantgear"
name = "radiantgear"
version = "0.4.1"
description = ""
authors = []
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins, beside data/ and assets/.
api = "0.2"
side = "both"
# registries: "May add blocks, items, mob effects and entity types to your worlds".
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "dd67b76ff23e28c6d8e21859df600d31572f81a0"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.module]]
id = "data"
file = "crates/horizon-client/src/game.rs"
name = "radiantgear_data"
source = "src/radiantgear_data.rs"

[[native.module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "radiantgear"
source = "src/runtime.rs"

# Radiant Gear: a worn trinket that glows lights up (Horizon Extras' dynamic lights).
[[native.mixin]]
id = "lights"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::dynamic_lights::Game<'_>::gather_dynamic_lights"
helper = "src/mixins/lights.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "alpha", ty = "f64", value = "alpha" },
]

# Worn items live in native-next/trinkets' slots.
[dependencies]
trinkets = { version = "^0.4", reason = "The glowing items are worn in Trinkets' slots: this mod reads the slots trinkets keeps (its trinkets:worn player attachment)." }
