# invisibleframes: a mixin bundle. As Invisible Frames 1.1.0 (Roundaround): sneak and use an item
# frame to toggle its invisibility (the item in it stays drawn); hitting a frame makes it visible
# again before the hit does what it always does.
id = "invisibleframes"
name = "invisibleframes"
version = "0.4.0"
description = ""
authors = []
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins, beside data/ and assets/.
api = "0.2"
side = "both"
# registries: "May add blocks, items, mob effects and entity types to your worlds".
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "dd67b76ff23e28c6d8e21859df600d31572f81a0"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.mixin]]
id = "toggle"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::frames::Game<'_>::interact_frame"
helper = "src/mixins/toggle.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "target", ty = "Option<InteractTarget>", value = "target" },
]

[[native.mixin]]
id = "show-on-hit"
kind = "HEAD"
target = "horizon_client::game::frames::Game<'_>::attack_frame"
helper = "src/mixins/show.rs"
bindings = [{ name = "game", ty = "&mut Game<'_>", value = "&mut *self" }]
