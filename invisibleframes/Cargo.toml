[package]
name = "mod-invisibleframes"
version = "0.5.3"
edition = "2024"
license = "MIT"
description = "Invisible Frames for Sunrise: sneak-use an item frame to hide it"
# Ported from: Invisible Frames 2.0.1 (Roundaround/mc-fabric-invisible-frames, MIT).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
