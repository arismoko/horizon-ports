[package]
name = "mod-betterdays"
version = "0.5.1"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "Better Days for Sunrise: day and night speeds, and sleeping that speeds the night up"
# Ported from: Better Days 4.1.1.7 (wendall911/BetterDays, LGPL-3.0).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
