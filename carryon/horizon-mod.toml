# carryon: Carry On 2.1.2.7 (Tschipp, Purplicious_Cow, cy4n; LGPL-3.0). One package: data/ and assets/ are the
# content mod mods/carryon (tools/carryon_port.py: the jar's lang files and its six empty tags). Everything else
# is the mod API (src/lib.rs): no game module and no mixin.
# - Sneak and right-click a block entity with both hands empty to pick it up with its contents; right-click a
#   block face to set it down. The same for a mob (Homestead's config: no hostile mobs in survival, at most 1.5
#   wide and 2.5 high); a carried mob can be stacked on another.
# - Carried things are drawn in first person (blocks in the hands, mobs over the hotbar) and on other players
#   (blocks); the state rides the `carryon:carried` channel.
id = "carryon"
name = "Carry On"
version = "0.3.0"
description = "Carry On: pick up chests and other blocks with their contents, and mobs, carry them and set them down (by Tschipp)"
authors = ["Tschipp", "Purplicious_Cow", "cy4n"]
api = "0.2"
side = "both"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "dd67b76ff23e28c6d8e21859df600d31572f81a0"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
