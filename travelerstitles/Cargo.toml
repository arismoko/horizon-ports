[package]
name = "mod-travelerstitles"
version = "0.5.1"
edition = "2024"
license = "LGPL-3.0-only"
description = "Traveler's Titles for Sunrise: large fading titles when you enter a new biome or dimension"
# Ported from: Traveler's Titles 26.1.2 (YUNG-GANG/Travelers-Titles, LGPL-3.0-only).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
