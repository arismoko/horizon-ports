[package]
name = "mod-rightclickharvest"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "Right Click Harvest for Sunrise: right-click a grown crop to harvest and replant it"
# Ported from: Right Click Harvest 4.7.2 (JamCoreModding/right-click-harvest, MIT).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
