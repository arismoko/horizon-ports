[package]
name = "mod-blockrunner"
version = "0.5.1"
edition = "2024"
license = "MPL-2.0"
description = "Block Runner for Sunrise: blocks that make you move faster or slower"
# Ported from: Block Runner 26.3.0 (Fuzss/blockrunner, MPL-2.0).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
