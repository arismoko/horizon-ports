[package]
name = "mod-betterthanmending"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Better Than Mending for Sunrise: repair Mending items with your experience"
# Ported from: Better Than Mending 2.3.0 (legobmw99/BetterThanMending, GPL-3.0).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
