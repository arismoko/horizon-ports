summary = "Bedrock-style reach-around block placement past edges, with crosshair directional indicators, block outlines, and slab alignment."
description = """
Bridging Mod brings Bedrock-style reach-around placement to Sunrise so you can bridge forward, upward, or downward without crouching backward over ledges:

- **Reach-around placement**: when your crosshair misses a block while holding a placeable block, traces along your view line and lets you right-click to place against the nearest valid edge.
- **Slab & trapdoor alignment**: aligns horizontally bridged slabs and trapdoors to your standing height and combines vertically bridged slabs into double slabs.
- **Crosshair indicator**: draws inverted-blend directional arrows around your crosshair (`up`, `down`, `horizontal`) whenever reach-around placement is active, shifting cleanly when F3 is open.
- **Configurable block outlines & F3 trace**: highlights the target block in your chosen color and opacity, with optional outlines for normal block placement and an F3 debug trace of every checked voxel.
- **Flexible controls**: bind **Toggle Reacharound Placement** (default `,`) in **Options → Controls**, restrict bridging to horizontal/vertical axes or crouching, skip torches, toggle non-solid block replacement, and adjust minimum distance, snap strength, adjacency, and perspective lock in **Options → Mods → Bridging Mod** or `config/bridgingmod.toml`.

Client-side only: works in single player and on any multiplayer server.

Differences from the original:

- **Post-bridging delay below 4 ticks**: delays from `4` to `20` ticks are supported, but lowering the cooldown below vanilla's 4-tick right-click delay is not possible yet (gap: TBD-post-bridging-delay).
- **Skip torch bridging with offhand blocks**: when holding a torch in the main hand and blocks in the offhand with `skipTorchBridging` enabled, bridging is suppressed instead of skipping the main hand to place from the offhand (gap: TBD-client-use-item-on).
- **Configuration UI layout**: settings live in Sunrise's flat **Options → Mods → Bridging Mod** page with separate RGB color and opacity controls rather than a tabbed screen with preview images (gap: TBD-config-tabs).
- Optional integrations for third-party mods not on Sunrise (Dynamic Crosshair, Dank Storage, Sable) are omitted.

A port of Bridging Mod by CG360, under the MIT licence.
"""
categories = ["utility", "game-mechanics"]
