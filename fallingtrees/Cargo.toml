[package]
name = "mod-fallingtrees"
version = "0.5.4"
edition = "2024"
license = "GPL-3.0-only"
description = "Falling Trees for Sunrise: chop a tree's log with an axe and the whole tree comes down"
# Ported from: Panda's Falling Trees 0.13.2 (PandaMods-Dev/Pandas-Falling-Trees, GPL-3.0-only).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
