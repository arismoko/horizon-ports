[package]
name = "mod-clumps"
version = "0.5.3"
edition = "2024"
license = "MIT"
description = "Clumps for Sunrise: groups nearby experience orbs into a single orb and removes pickup delay"
# Ported from: Clumps 26.3 (jaredlll08/Clumps, MIT).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
