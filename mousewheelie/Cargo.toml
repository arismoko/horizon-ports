[package]
name = "mod-mousewheelie"
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
description = "Mouse Wheelie for Sunrise: scroll items between slots, sort with the middle button, refill the hotbar"
# Ported from: Mouse Wheelie 1.16.3 (Siphalor/mouse-wheelie, Apache-2.0).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
