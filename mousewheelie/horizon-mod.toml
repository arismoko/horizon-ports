# mousewheelie: Mouse Wheelie 1.16.3 (Siphalor, Apache-2.0) for Horizon, with Homestead's config.
# In the inventory and the chest-like screens (chests, barrels, ender chests, shulker boxes, hoppers,
# dispensers), furnaces and crafting tables:
# - The wheel over a slot moves its items towards where the wheel turns (directional scrolling): up
#   from the inventory into the container, down from the container into the inventory (in the
#   inventory screen, hotbar <-> main inventory). One item; Shift the whole stack; Ctrl every stack
#   of the item; Space moves the matching kinds (deposit) or tops up partial stacks (restock). The
#   wheel up on armour in the inventory screen puts it on.
# - Ctrl+click moves every stack of the item, Ctrl+Shift+click everything in that part; Alt+click
#   drops the stack (Alt+Ctrl every stack of the item, Alt+Ctrl+Shift the whole part); Space+click
#   deposits. Dragging with Alt, Shift or Ctrl held does the same on each slot crossed.
# - The middle button sorts the part under the cursor: creative order, Shift by quantity, Ctrl by
#   name. The hotbar is its own part.
# - Pick block while holding a tool or weapon picks the best tool for the block (or a weapon for an
#   entity) from the inventory.
#
# Everything is ordinary slot clicks (the game's own `tweak_click`), so it runs on any server.
id = "mousewheelie"
name = "mousewheelie"
version = "0.4.1"
description = ""
authors = []
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins, beside data/ and assets/.
api = "0.2"
side = "both"
# registries: "May add blocks, items, mob effects and entity types to your worlds".
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "dd67b76ff23e28c6d8e21859df600d31572f81a0"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "mousewheelie"
source = "src/runtime.rs"

[[native.mixin]]
id = "scroll"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::extras::mouse_tweaks::Game<'_>::tweak_scroll"
helper = "src/mixins/scroll.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "self" },
  { name = "delta", ty = "f32", value = "delta" },
  { name = "slot", ty = "Option<usize>", value = "slot" },
]

[[native.mixin]]
id = "press"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::inventory_input::Game<'_>::inventory_press"
helper = "src/mixins/press.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "self" },
  { name = "right", ty = "bool", value = "right" },
]

[[native.mixin]]
id = "release"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::inventory_input::Game<'_>::inventory_mouse_release"
helper = "src/mixins/release.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "self" },
  { name = "right", ty = "bool", value = "right" },
]

[[native.mixin]]
id = "drag"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::inventory_input::Game<'_>::inventory_drag_move"
helper = "src/mixins/drag.rs"
bindings = [{ name = "game", ty = "&mut Game<'_>", value = "self" }]

[[native.mixin]]
id = "sort"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::extras::sorting::Game<'_>::sort_mouse_press"
helper = "src/mixins/sort.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "self" },
  { name = "button", ty = "MouseButton", value = "button" },
]

[[native.mixin]]
id = "pick"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::native_hooks::interaction::Game<'_>::native_interaction"
helper = "src/mixins/pick.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "self" },
  { name = "key", ty = "InteractionKey", value = "key" },
]
