[package]
name = "mod-dynamicfps"
version = "0.5.5"
edition = "2024"
license = "MIT"
description = "Dynamic FPS for Sunrise: reduces frame rate and audio volume while unfocused, minimized, idle, or on battery"
# Ported from: Dynamic FPS 3.11.10 (juliand665/Dynamic-FPS, MIT).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
