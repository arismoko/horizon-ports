# craftingpad: a mixin bundle. As Crafting Pad 1.0.12 (StrikerRocker): using the crafting pad
# opens a 3x3 crafting grid wherever the player is. The item itself (texture, recipe: a
# crafting table over a stick) is in the Homestead dev mod, `mods/homestead`, namespace
# `craftingpad`.
id = "craftingpad"
name = "craftingpad"
version = "0.4.0"
description = ""
authors = []
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins, beside data/ and assets/.
api = "0.2"
side = "both"
# registries: "May add blocks, items, mob effects and entity types to your worlds".
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "dd67b76ff23e28c6d8e21859df600d31572f81a0"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

# use_hand is one hand's turn of the right click (startUseItem); in single player it runs on the
# server thread's Game, for the window's player as for a LAN guest. The pad in hand opens the
# 3x3 grid as a crafting table's click does, at a position no block has (open.rs).
[[native.mixin]]
id = "open"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::use_hand::Game<'_>::use_hand"
helper = "src/mixins/open.rs"
bindings = [{ name = "game", ty = "&mut Game<'_>", value = "&mut *self" }]


# CraftingMenu.stillValid on the server: true for the pad's position (valid.rs). Without it the tick that closes
# crafting windows with no table near shuts the pad's grid at once. Dropped on 3a6bea5 (every lan_crafting function
# hit the mixin mirror bug, E0603 `MenuOwner`); back on dd67b76 with launcher 0.2.88 (horizon#18462, fixed by #18509).
[[native.mixin]]
id = "valid"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::lan_crafting::Game<'_>::lan_table_valid"
helper = "src/mixins/valid.rs"
bindings = [{ name = "pos", ty = "[i32; 3]", value = "pos" }]
