# hearth_and_home: Hearth & Home 2.0.3 (Starfish Studios; the jar says MIT, kept LAN-only with the pack for now).
# Homestead has no config for it. One package: data/ and assets/ are the content mod mods/hearth_and_home
# (tools/hearth_and_home_port.py; fixed for this build by tools/next_content_fix.py). src/runtime.rs is the game
# module (crate::game::hearth_and_home): chimney tops and lighting, connecting lattices, columns, facing tile
# slabs and the wooden blocks' fire odds, reached by the mixins below. src/lib.rs (mod API) declares the
# chimneys' block entity type, sends their smoke and takes the shovel and igniter clicks.
id = "hearth_and_home"
name = "Hearth & Home"
version = "0.3.0"
description = "Hearth & Home: chimneys, lattices, columns, shingles, tiles, parquet, trims, paper lanterns (by Starfish Studios)"
authors = ["Starfish Studios"]
api = "0.2"
side = "both"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "dd67b76ff23e28c6d8e21859df600d31572f81a0"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "hearth_and_home"
source = "src/runtime.rs"

# getStateForPlacement: chimney top and lit, lattice facing and connection, column axis and type, tile slabs.
[[native.mixin]]
id = "placement"
kind = "HEAD"
target = "horizon_client::game::level_access::<GameLevel<'_> as LevelAccess>::before_state_for_placement"
helper = "src/mixins/placement.rs"
bindings = [
  { name = "level", ty = "&GameLevel<'_>", value = "&*self" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "context", ty = "&PlacementContext", value = "context" },
  { name = "fluid", ty = "FluidState", value = "fluid" },
  { name = "answer", ty = "&mut Option<Option<BlockStateId>>", value = "&mut *answer" },
]

# updateShape / neighborChanged: chimney tops, lattice connections, column types.
[[native.mixin]]
id = "update_shape"
kind = "HEAD"
target = "horizon_client::game::level_access::<GameLevel<'_> as LevelAccess>::before_update_shape"
helper = "src/mixins/update_shape.rs"
bindings = [
  { name = "level", ty = "&GameLevel<'_>", value = "&*self" },
  { name = "pos", ty = "BlockPos", value = "pos" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "direction", ty = "Direction", value = "direction" },
  { name = "neighbour_pos", ty = "BlockPos", value = "neighbour_pos" },
  { name = "neighbour", ty = "BlockStateId", value = "neighbour" },
  { name = "new", ty = "&mut Option<BlockStateId>", value = "&mut *new" },
]

# FireBlock.setFlammable (HNHBlocks.registerFlammables).
[[native.mixin]]
id = "fire_odds"
kind = "HEAD"
target = "horizon_client::game::level_access::<GameLevel<'_> as LevelAccess>::before_fire_odds"
helper = "src/mixins/fire_odds.rs"
bindings = [
  { name = "level", ty = "&GameLevel<'_>", value = "&*self" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "odds", ty = "&mut Option<(i32, i32)>", value = "&mut *odds" },
]
