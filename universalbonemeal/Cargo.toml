[package]
name = "mod-universalbonemeal"
version = "0.5.4"
edition = "2024"
license = "MPL-2.0"
description = "Universal Bone Meal for Sunrise: bone meal grows more plants"
# Ported from: Universal Bone Meal 26.3.1 (Fuzss/universal-bone-meal, MPL-2.0).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
