summary = "Bone meal grows cactus, sugar cane, vines, nether wart, chorus, coral, flowers and more."
description = """
Bone meal works on the plants vanilla leaves out, and a few blocks besides:

- Cactus and sugar cane grow one or two blocks taller, up to a height between 12 and 16 that is fixed for each spot. Cactus sometimes grows a cactus flower on top.
- Vines grow up to five blocks downwards.
- Nether wart grows one stage, three times in four.
- Ripe melon and pumpkin stems get a few growth ticks to grow their fruit.
- A chorus flower gets a growth tick, and a chorus plant gives one to every flower it reaches.
- Lily pads, dead bushes and small flowers spread copies of themselves nearby, where each can survive.
- Mycelium grows red and brown mushrooms. Podzol grows ferns, large ferns, sweet berry bushes and the odd dead bush.
- Dirt, coarse dirt, rooted dirt and dirt paths next to grass or mycelium turn into it, if sky light reaches them.
- Coral in a warm ocean has a two-in-five chance to grow into a coral tree, claw or mushroom.
- A spore blossom drops another spore blossom.
- Blocks in `#universalbonemeal:fertilizer_resistant_plants` (torchflowers and wither roses by default) never take bone meal.

Each use takes one bone meal, as vanilla's does, and shows vanilla's green growth particles.

Differences from the original:

- Only the spread rules for lily pads, dead bushes and small flowers are data (`universalbonemeal:spread_rule`); the other growth rules are in code, and clients don't predict the spread.

A port of Universal Bone Meal by Fuzs, under the MPL-2.0 licence.
"""
categories = ["game-mechanics"]

