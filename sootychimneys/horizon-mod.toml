# sootychimneys: the rules half of Sooty Chimneys 1.3.4 (mortuusars) with Homestead's
# sootychimneys-common.toml (SmokeFlow 0.75, DirtyChance 0.05, Wind on, WindStrength 1.0).
# The fourteen chimneys are in data/ and assets/ (tools/sootychimneys_port.py writes mods/sootychimneys,
# tools/build_next.py merges it here).
# - every chimney has a ticking block entity (ChimneyBlockEntity, the `Chimney` part). Its server
#   tick keeps `lit` (no redstone signal) and `stacked` (a chimney above) as
#   ChimneyBlock.updateState does, cleans a dirty chimney that gets stacked, dirties a clean one
#   that smokes at the random-tick rate times DirtyChance, and sends the smoke (the client
#   particleTick there) with the wind (Wind.update, one wind for the server);
# - right_click_block hook: ChimneyBlock.use, an empty main hand toggles `blocked`, an axe scrapes a
#   dirty chimney clean (soot_scraping: black dye at its chance).
id = "sootychimneys"
name = "sootychimneys"
version = "0.5.0"
description = ""
authors = []
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins, beside data/ and assets/.
api = "0.2"
side = "both"
# registries: "May add blocks, items, mob effects and entity types to your worlds".
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "dd67b76ff23e28c6d8e21859df600d31572f81a0"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

