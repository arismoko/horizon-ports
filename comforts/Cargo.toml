[package]
name = "mod-comforts"
version = "0.5.1"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "Comforts for Sunrise: sleeping bags and hammocks without changing your spawn point"
# Ported from: Comforts 26.x (illusivesoulworks/comforts, LGPL-3.0-or-later).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
serde_json = "1"
