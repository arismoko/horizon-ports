[package]
name = "mod-preferredgamerules"
version = "0.5.3"
edition = "2024"
license = "MIT"
description = "Preferred Gamerules for Sunrise: new worlds start with your preferred game rules"
# Ported from: Preferred Gamerules 2.0.1 (Estecka/mc-Preferred-Gamerules, MIT).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
