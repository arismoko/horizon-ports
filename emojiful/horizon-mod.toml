# emojiful: Emojiful 4.2.0 (HorizonStudio, MIT) with Homestead's config: `:short_name:` in chat shows
# the Twemoji emoji (iamcal/emoji-data's names, as Emojiful loads them).
# - src/lib.rs: `client_chat_received` rewrites the line shown (the old bundle patched
#   horizon_client_render's Chat::push_message, which mixins can't patch now).
# - assets/: the Emojiful resource pack (packs/emojiful, tools/emojiful_port.py), now part of the
#   package. Its bitmap glyphs were on `minecraft:default`; a mod may not add to vanilla's fonts,
#   so they are the font `emojiful:emoji` (assets/emojiful/font/emoji.json), which the emoji runs
#   name in their style.
# Not ported: EmojiSuggestionHelper (`:name` completions in the chat box). The old target
# ChatScreen::update_command_info is in horizon_client_render (not patchable), and the screen's
# suggestion list (`pending`, `show_suggestions`) is private to that crate; no hook adds chat
# suggestions (`chat_suggestion_applied` only reports one).
id = "emojiful"
name = "Emojiful"
version = "0.4.0"
description = "Twemoji in chat by :short_name: (Emojiful 4.2.0 by HorizonStudio, MIT)"
authors = []
api = "0.2"
side = "both"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "dd67b76ff23e28c6d8e21859df600d31572f81a0"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
