[package]
name = "mod-bettermounthud"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Better Mount HUD for Sunrise: keeps hunger and experience visible while riding and moves the mount's health above them"
# Ported from: Better Mount HUD 1.3.1 (Lortseam/better-mount-hud, GPL-3.0).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
