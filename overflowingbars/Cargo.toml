[package]
name = "mod-overflowingbars"
version = "0.5.0"
edition = "2024"
license = "MPL-2.0"
description = "Overflowing Bars for Sunrise: stacks health, armor and armor toughness into coloured rows with row counts"
# Ported from: Overflowing Bars 26.3.0 (Fuzss/overflowing-bars, MPL-2.0).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
