[package]
name = "mod-shouldersurfing"
version = "0.5.3"
edition = "2024"
license = "MIT"
description = "Shoulder Surfing Reloaded for Sunrise: an over-the-shoulder third-person camera with a decoupled view and a crosshair that follows what you act on"
# Ported from: Shoulder Surfing Reloaded 5.3.1 (Exopandora/ShoulderSurfing, MIT).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
