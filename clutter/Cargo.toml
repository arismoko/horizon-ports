[package]
name = "mod-clutter"
version = "0.3.2"
edition = "2024"
license = "MIT"
description = "Clutter for Sunrise: furniture, lamps, curtains, candles, plants and crops on the typed mod API"
# Ported from: Clutter 0.6.2 (EmilsGithub/Clutter-Mod-Repository, MIT).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
