[package]
name = "mod-obsidianequipmentrework"
version = "1.2.0"
edition = "2024"
license = "CC0-1.0"
description = "Obsidian Equipment Reworked for Sunrise: obsidian equipment between diamond and netherite"
# Ported from: Obsidian Equipment Reworked 1.2 (CozyCord/Obsidian-Equipment-Reworked, CC0-1.0).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
