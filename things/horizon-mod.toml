# things: Things 0.3.3 (glisco, MIT). One package: data/ and assets/ are the content mod mods/things
# (tools/things_port.py), copied here because a content package can't use a compiled mod's id.
# - src/lib.rs (mod_api::Hooks): the trinkets worn in native-next/trinkets' slots (effects, the
#   socks', Arm Extender's and Wax Gland's attribute modifiers, the Shock Absorber, Placebo, Luck
#   of the Irish), the Item Magnet, the Infernal Scepter, the Container Key, the Recall Potion,
#   the Hardening Catalyst (`anvil_update`), the socks' toggle key.
# - src/runtime.rs + the wucket mixin: the Bater Wucket (BucketItemMixin), which no hook covers.
# Not ported: the sock recipes (SockUpgradeRecipe, JumpySocksRecipe; their recipe files are left
# out, as the game refuses an unknown serializer). The old target Recipes::find_with is in
# horizon_client_lib, which mixins can't patch now; the click functions in lan_crafting.rs can't be
# patched either (their module imports the private `transactions::decision::MenuOwner`, E0603 in
# the mirror); and the `prepare_item_craft` hook reads the player's menu as it was before the
# click, so a result from it would follow the previous grid (a dupe: take the socks out, the
# upgraded socks stay in the result slot).
id = "things"
name = "Things"
version = "0.4.1"
description = "Trinkets and tools (Things 0.3.3 by glisco, MIT)"
authors = []
api = "0.2"
side = "both"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "dd67b76ff23e28c6d8e21859df600d31572f81a0"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "things"
source = "src/runtime.rs"

# BucketItemMixin and the Bater Wucket's cauldron behaviour: used as a water bucket, given back full.
[[native.mixin]]
id = "wucket"
kind = "HEAD"
cancellable = true
priority = 105
target = "horizon_client::game::Game<'_>::use_tool"
helper = "src/mixins/wucket.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&ItemStack", value = "stack" },
  { name = "allow", ty = "bool", value = "allow_block_actions" },
]

# The trinkets are worn in native-next/trinkets' slots; the tools, the Container Key, the Recall Potion and the
# Bater Wucket work without it.
[dependencies]
trinkets = { version = "^0.4", optional = true, reason = "Things' trinkets (socks, gloves, necklaces, the Monocle) are worn in Trinkets' slots (the G menu). Without it the tools still work." }
