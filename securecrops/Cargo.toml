[package]
name = "mod-securecrops"
version = "0.5.2"
edition = "2024"
license = "MIT"
description = "Secure Crops for Sunrise: game rules that stop farmland trampling"
# Ported from: Secure Crops 2.0.1 (zekk051/secure-crops, MIT).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
