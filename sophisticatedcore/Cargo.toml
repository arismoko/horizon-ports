[package]
name = "mod-sophisticatedcore"
version = "0.5.2"
edition = "2024"
license = "GPL-3.0-only"
description = "Sophisticated Backpacks and Storage for Sunrise: tiered backpacks, chests, barrels and shulker boxes with upgrades"
# Ported from: Sophisticated Core, Backpacks and Storage (Salandora's Fabric ports, GPL-3.0).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
