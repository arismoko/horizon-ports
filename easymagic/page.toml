summary = "Enchanting tables keep their items, reroll enchantments, accept lenient and chiseled bookshelves, and show chiseled bookshelf book tooltips."
description = """
Easy Magic makes enchanting smoother without breaking vanilla balance:

- **Persistent contents**: items and catalysts stay inside the enchanting table when you close its screen, persist with the world, drop when the table is broken, and work with hoppers and redstone comparators.
- **Reroll enchantments**: reroll the offered enchantments straight from the enchanting table for a configurable experience and catalyst cost (or unlock a third slot for `#easymagic:reroll_catalysts`, amethyst shards by default).
- **Configurable clues**: display `NONE`, `SINGLE`, or `ALL` enchantments in offer tooltips, along with enchantment descriptions when a resource pack provides them.
- **Lenient and chiseled bookshelves**: torches, carpets, and other non-full blocks no longer block bookshelves, and chiseled bookshelves contribute enchanting power (1 per 3 stored books) plus particles.
- **Chiseled bookshelf tooltips**: look at any book stored in a chiseled bookshelf to see its full tooltip on the HUD (`DISABLED`, `CROUCHING`, or `ENABLED`).

Server options are configured in `config/easymagic-server.toml` and synced to clients. Client options are available in `config/easymagic-client.toml` and **Options → Mods → Easy Magic**.

Needed on both the server and the client.

Differences from the original:

- Floating/flat 3D item rendering on top of enchanting tables in the world is not yet implemented, as Sunrise's block-entity render hook currently dispatches only for mod block entities rather than vanilla enchanting tables.
- The `keep_enchantment_screen_book` option hides the reroll button while keeping the clickable reroll region and tooltip, drawing a static book icon rather than vanilla's animated 3D opening book model.

A port of Easy Magic by Fuzs, under the MPL-2.0 licence.
"""
categories = ["game-mechanics", "utility"]
