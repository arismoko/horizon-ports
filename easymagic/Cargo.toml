[package]
name = "mod-easymagic"
version = "0.5.1"
edition = "2024"
license = "MPL-2.0"
description = "Easy Magic for Sunrise: persistent enchanting tables, enchantment rerolling, lenient and chiseled bookshelves"
# Ported from: Easy Magic 8.0.1 / 26.3.1 (Fuzss/easymagic, MPL-2.0).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
serde_json = "1"
