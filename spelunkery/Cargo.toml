[package]
name = "mod-spelunkery"
version = "0.1.2"
edition = "2024"
license = "LGPL-3.0-only"
description = "Spelunkery for Sunrise: ores in granite, andesite, diorite and tuff, rough gems, cave mushrooms, rock salt, glowsticks and rope ladders"
# Ported from: Spelunkery 0.3.16 (AstralOrdana/Spelunkery, LGPL-3.0-only).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
