# farmersdelight: Farmer's Delight 2.4.1+refabricated (vectorwing, MehVahdJukaar, MerchantPug;
# MIT) with Homestead's farmersdelight-common.toml. One package: data/ and assets/ are the content
# mod mods/farmersdelight (tools/farmersdelight_port.py; block shapes fixed for this build by
# tools/next_content_fix.py), copied here because a content package can't take a compiled mod's id.
# src/fd.rs holds the rules (the machines' block entities, ticks, slots, drawing and screens; the
# blocks' right clicks; seeds, rope and tilling; the crops' and soils' random ticks, bone meal,
# survival and placement; the foods' effects), and src/lib.rs reaches them through the mod API only
# (parts and hooks; no game module or mixin since 0.5.0). It also serves the delight add-ons' blocks.
id = "farmersdelight"
name = "Farmer's Delight"
version = "0.5.0"
description = "Cooking, farming and food: stoves, cooking pots, skillets, cutting boards, crops and meals (Farmer's Delight 2.4.1 by vectorwing, MehVahdJukaar, MerchantPug)"
authors = ["vectorwing", "MehVahdJukaar", "MerchantPug"]
api = "0.2"
side = "both"
capabilities = ["registries"]

