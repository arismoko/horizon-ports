[package]
name = "mod-mythicupgrades"
version = "0.3.3"
edition = "2024"
license = "MIT"
description = "Mythic Upgrades for Sunrise: eight gems and necoium, their ores, crystal geodes and gear whose armour sets and tools each have their own effect"
# Ported from: Mythic Upgrades 5.1.1 (TriQue06/mythic-upgrades-multiloader, MIT).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
