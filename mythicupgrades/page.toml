summary = "Eight gems and necoium with their ores and crystal geodes, and armour sets and tools that each have their own effect."
description = """
Eight gems (sapphire, ametrine, topaz, ruby, peridot, aquamarine, citrine and jade) and necoium, with their ores, crystal geodes and caves, crystal blocks, schist stone, and a full set of tools and armour for each gem.

- **Ores and geodes**: gem ores drop experience like vanilla ores, and budding crystals grow their own buds, from small to large to a cluster, on a random side.
- **Armour sets**: each worn piece adds levels to its gem's effect: Damage Deflection (sapphire), Arcane Aura (ametrine), Topaz Reaction, Blood Thirst (ruby), Miasma (peridot), Ice Shield (aquamarine), Static Field (citrine) and Jade Aura.
- **Tools**: each gem's sword, pickaxe, axe, shovel and hoe has its own effect, such as lifesteal, chain lightning, freezing, levitation, teleporting and shocks.
- **Necoium Share**: holders within 30 blocks share their gem effects.
- **Smithing and loot**: gear is made at the smithing table with the Mythic upgrade template, which can be found in end city treasure.

A port of Mythic Upgrades by TriQue, under the MIT licence.
"""
categories = ["equipment", "game-mechanics"]

