[package]
name = "mod-accelerateddecay"
version = "0.5.3"
edition = "2024"
license = "GPL-3.0-only"
description = "Accelerated Decay for Sunrise: unsupported leaves decay quickly"
# Ported from: Accelerated Decay 26.3.0.1 (ErrorMikey/AcceleratedDecay, GPL-3.0-only).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
