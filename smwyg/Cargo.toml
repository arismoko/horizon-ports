[package]
name = "mod-smwyg"
version = "0.5.4"
edition = "2024"
license = "MIT"
description = "Show Me What You Got for Sunrise: show your items in chat"
# Ported from: Show Me What You Got 1.2.0 (apace100/show-me-what-you-got, MIT).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
