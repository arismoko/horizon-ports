# grindenchantments: Grind Enchantments 3.1.4 (mschae23) with Homestead's config (curses can be
# removed, the enchanted item isn't consumed, move on, the cost shown). Two grindstone operations:
# disenchant (an enchanted item + a book -> an enchanted book with all its enchantments) and move
# (an enchanted book with 2+ enchantments + a book or enchanted book -> its first one moves).
# - src/lib.rs: a menu part lets a book into the grindstone's inputs (menu_slot_rules); the
#   `grindstone_place` hook hides the result from a player who can't pay its levels, the
#   `grindstone_take` hook takes the levels.
# - mixin `click` on lan_station_click (server.rs): before a guest's click runs, a result whose
#   cost the guest can no longer pay is taken away, so the engine can't move it; a click that
#   moves it is charged by `grindstone_take` in the same op, at the levels checked.
# - mixins on the game's grindstone hook dispatchers (`api_grindstone_place`, `api_grindstone_take`):
#   the operation's result and the inputs it leaves, computed with the game's enchantment data
#   (runtime.rs), which a server hook has no access to (`enchantment_min_cost` is client-only).
# - mixin `label` on draw_station: "Enchantment Cost: N" on the screen.
id = "grindenchantments"
name = "grindenchantments"
version = "0.4.1"
description = ""
authors = []
api = "0.2"
side = "both"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "dd67b76ff23e28c6d8e21859df600d31572f81a0"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.module]]
id = "runtime"
file = "crates/horizon-client/src/game/blocks/stations.rs"
name = "grindenchantments"
source = "src/runtime.rs"

[[native.module]]
id = "server"
file = "crates/horizon-client/src/game/network/lan_stations.rs"
name = "grindenchantments"
source = "src/server.rs"

[[native.mixin]]
id = "place"
kind = "HEAD"
target = "horizon_client::game::api_values::super::Game<'_>::api_grindstone_place"
helper = "src/mixins/place.rs"
bindings = [
  { name = "game", ty = "&mut super::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "value", ty = "&mut crate::menu::GrindstonePlace", value = "value" },
]

[[native.mixin]]
id = "take"
kind = "HEAD"
target = "horizon_client::game::api_values::super::Game<'_>::api_grindstone_take"
helper = "src/mixins/take.rs"
bindings = [
  { name = "game", ty = "&mut super::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "value", ty = "&mut crate::menu::GrindstoneTake", value = "value" },
]

# The authoritative take: the cost re-checked before the click can move the result.
[[native.mixin]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::lan_stations::Game<'_>::lan_station_click"
helper = "src/mixins/click.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "conn", ty = "u32", value = "conn" },
  { name = "p", ty = "&play::ContainerClick", value = "p" },
]

[[native.mixin]]
id = "label"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::stations::draw::Game<'_>::draw_station"
helper = "src/mixins/label.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut HudBatch", value = "&mut *batch" },
]
