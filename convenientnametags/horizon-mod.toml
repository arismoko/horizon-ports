# convenientnametags: a mixin bundle. As Convenient Name Tags 1.1.0 (mim1q) with Homestead's
# config:
# - a named mob that dies drops a name tag with its name (dropNameTagsOnDeath);
# - sneak and use shears on a named mob: the name comes off as a name tag, the shears take 1
#   damage, and the mob's own interaction doesn't run (enableNameTagShearing);
# - naming a named mob drops its old name as a tag; a tag with the same name isn't used up
#   (dropNameTagsOnNameChange).
# The rename screen (use a name tag in the air) is not ported. The recipe is in mods/homestead.
id = "convenientnametags"
name = "convenientnametags"
version = "0.4.1"
description = ""
authors = []
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins, beside data/ and assets/.
api = "0.2"
side = "both"
# registries: "May add blocks, items, mob effects and entity types to your worlds".
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "dd67b76ff23e28c6d8e21859df600d31572f81a0"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.module]]
id = "runtime"
file = "crates/horizon-client/src/game/mobs/creatures/mod.rs"
name = "convenientnametags"
source = "src/runtime.rs"

# LivingEntityMixin.dropInventory: the death drops.
[[native.mixin]]
id = "death"
kind = "HEAD"
target = "horizon_client::game::creatures::death_weapon::Game<'_>::drop_death_loot"
helper = "src/mixins/death.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "m", ty = "&Mob", value = "&*m" },
]

# NameTagItemMixin.useOnEntity.
[[native.mixin]]
id = "rename"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::names::Game<'_>::name_mob"
helper = "src/mixins/rename.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "index", ty = "usize", value = "index" },
]

# ShearsItemMixin.useOnEntity and CancelInteractMobMixin.
[[native.mixin]]
id = "shear"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::native_hooks::base::Game<'_>::native_entity_interact"
helper = "src/mixins/shear.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "entity", ty = "i32", value = "entity" },
  { name = "result", ty = "&mut Option<mod_api::InteractionResult>", value = "&mut *result" },
]

