[package]
name = "mod-easyanvils"
version = "0.5.3"
edition = "2024"
license = "MPL-2.0"
description = "Easy Anvils for Sunrise: persistent anvils, configurable prior work penalty and repair costs, iron block anvil repair, and formatted renaming"
# Ported from: Easy Anvils 26.3.1 (Fuzss/easyanvils, MPL-2.0).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
serde_json = "1"
