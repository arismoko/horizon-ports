[package]
name = "mod-betterpingdisplay"
version = "0.5.5"
edition = "2024"
license = "MIT"
description = "Better Ping Display for Sunrise: shows each player's ping as a coloured number in the player list"
# Ported from: Better Ping Display 1.2.0 (vladmarica/better-ping-display-fabric, MIT).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
