summary = "Shows each player's actual ping in milliseconds (with latency-based colour) in the Tab player list."
description = """
Better Ping Display replaces or accompanies the default ping bars in the Tab player list with each player's numeric latency in milliseconds:

- **Numeric ping readout**: displays each listed player's ping (formatted with `%dms` by default) right-aligned in widened player list slots so it never overlaps names or scoreboard values.
- **Latency-based auto-colouring**: smoothly interpolates ping text colour from green (`0 ms`) through yellow (`150 ms`) to red (`300+ ms`), and grey when latency is unknown (`< 0 ms`).
- **Custom static colour**: turn off **Auto-color Ping Text** to use any RGB colour picked in **Options → Mods → Better Ping Display** (default `#a0a0a0`).
- **Optional vanilla ping bars**: enable **Render Ping Bars** to keep the vanilla signal bars beside the numeric readout.
- **Custom format string**: edit `ping_text_format_string` in `config/betterpingdisplay.toml` (any string containing `%d`, hot-reloaded on save).
- **Full vanilla player list support**: preserves headers, footers, multi-column layout, player heads, team-formatted names, spectator styling, `list` scoreboard integer scores and animated hearts, visibility rules, and narration.

Client-side only: works on any multiplayer server and in LAN worlds.

Differences from the original:

- Because the mod API does not yet have a per-entry player-list ping render hook, this port wraps and replaces the `minecraft:tab_list` HUD layer; `ClientTabList` does not expose `online_mode` or per-player hat visibility, so player heads are always drawn with the hat layer enabled (gap: sunrise-org/sunrise#5596).
- **Ping Text Format String** is edited in `config/betterpingdisplay.toml` (hot-reloaded on save) rather than in **Options → Mods → Better Ping Display**, and **Ping Text Color** stays interactive while **Auto-color Ping Text** is on, because Sunrise's mod settings UI does not yet have a string input or conditional row disabling (gap: sunrise-org/sunrise#1174).

A port of Better Ping Display by Vlad Marica (Quintinity), under the MIT licence.
"""
