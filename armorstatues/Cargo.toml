[package]
name = "mod-armorstatues"
version = "0.5.3"
edition = "2024"
license = "MPL-2.0"
description = "Armor Statues for Sunrise: pose, style, scale, align, move and equip armor stands"
# Ported from: Armor Statues (Fuzss/armorstatues + Fuzss/statuemenus, MPL-2.0).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
