# armorstatues: Armor Statues 8.0.6 (Fuzs, MPL-2.0) for Horizon, as a native trait mod
# (docs/native-mods.md, "Trait mods" and "Server menus"). Sneak and use an armor stand with an
# empty hand: a chest menu edits it (style, poses, rotations, position, alignments). A server menu
# needs nothing on the player's side, so LAN guests and vanilla clients get it too.
id = "armorstatues"
name = "armorstatues"
version = "0.4.0"
description = ""
authors = []
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins, beside data/ and assets/.
api = "0.2"
side = "both"
# registries: "May add blocks, items, mob effects and entity types to your worlds".
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "dd67b76ff23e28c6d8e21859df600d31572f81a0"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
