# Expanded Delight 0.3.2 (ianm1647; MIT), ported by tools/delight_addons.py (mods/expandeddelight; tools/build_next.py
# merges its data/ and assets/ here). The code only registers the add-on's own recipe type `expandeddelight:juicing`
# (a raw type: native-next/farmersdelight's runtime runs the juicer and reads these recipes with `recipes_of_type`).
# A recipe type can only be registered by the package owning its namespace, and an unregistered one stops the whole
# recipe load, so this add-on is a code package and the other add-ons stay content packages.
id = "expandeddelight"
name = "Expanded Delight"
version = "0.6.0"
description = "More Farmer's Delight crops and foods: asparagus, sweet potatoes, chili peppers, peanuts, cinnamon, salt, cheese, the juicer and the mortar and pestle."
authors = ["ianm1647"]
api = "0.2"
side = "both"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "dd67b76ff23e28c6d8e21859df600d31572f81a0"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

# The juicer, the cooking recipes and the crops' blocks run on Farmer's Delight's rules and recipe types.
[dependencies]
farmersdelight = { version = "^0.5", reason = "Expanded Delight's cooking, cutting and juicing recipes run on Farmer's Delight." }
