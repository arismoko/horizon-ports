[package]
name = "mod-respectmytrims"
version = "0.5.2"
edition = "2024"
license = "LGPL-2.1-only"
description = "Respect My Trims for Sunrise: gold trims calm piglins"
# Ported from: Respect My Trims 1.4.0 (tnoctua/respectmytrims, LGPL-2.1).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
