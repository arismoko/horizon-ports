summary = "Adds wind-driven falling leaf and snowflake particles from leaf blocks."
description = """
Falling Leaves adds gentle, wind-driven falling leaf and snowflake particles to trees and leaf blocks:

- **Custom leaf physics**: regular, conifer, cherry, and vanilla-textured leaf particles with per-kind gravity, rain weight, accelerating spin, water floating and flow drift, lava burning, ground settling, and smooth 16-tick fade-out.
- **Smooth-noise wind**: transitions between **Calm**, **Windy**, and **Stormy** states with weather changes (rain and thunderstorms), with configurable `windless_dimensions` (`minecraft:the_nether`, `minecraft:the_end`).
- **Snowflakes from snowy trees**: drops snowflakes from leaf blocks in snowy biomes or under surface snow.
- **Hit and decay bursts**: hitting leaf blocks shakes loose 0–3 leaves and 0–6 snowflakes; decaying leaf blocks release a burst of leaves and snowflakes in both singleplayer and multiplayer.
- **Full configuration & 12 locales**: edit scalar settings in **Options → Mods → Falling Leaves** and per-block overrides or custom `leaf_spawners` (such as `minecraft:bamboo[leaves=large]`) in `config/fallingleaves-client.toml`.
- **F3 wind debug entry**: adds `fallingleaves:wind` in debug options to show live wind state and velocity.

Differences from the original:

- Vanilla's built-in leaf particles (`tinted_leaves`, `cherry_leaves`, `pale_oak_leaves`, poplar leaves) cannot be suppressed from `animate_tick` and continue to emit alongside Falling Leaves' custom particles (gap: TBD-suppress-vanilla-animate-tick).
- Uses `side = "both"` rather than `side = "client"` (and has no `registerParticles = false` mode) because Sunrise requires `side = "both"` for code-defined particle providers (gap: TBD-client-particle-provider).
- Leaf particle tint uses exact biome-blended `block_tint_color` and vanilla base colors rather than averaging stitched `TextureAtlasSprite` pixels for custom resource-pack or modded untinted leaves (gap: TBD-sprite-average-color).
- Resource packs cannot add unregistered per-block sprite sets under `assets/fallingleaves/particles/block/<ns>/<path>.json` (gap: TBD-dynamic-particle-sprites).
- Per-block `leaf_settings` maps and `windless_dimensions` / `leaf_spawners` lists are edited in `config/fallingleaves-client.toml` rather than in-game (gap: TBD-structured-settings-ui).
- Fabric Seasons and Serene Seasons compatibility multipliers are omitted because those mods are not present on Sunrise.

A port of Falling Leaves by Fourmisain, BrekiTomasson, and RandomMcSomethin, under the MIT licence.
"""
categories = ["decoration"]
