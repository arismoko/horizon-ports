[package]
name = "mod-cropsloverain"
version = "0.5.2"
edition = "2024"
license = "MIT"
description = "Crops Love Rain for Sunrise: crops grow faster in the rain"
# Ported from: Crops Love Rain 3.2.2 (ThePoultryMan/Crops-Love-Rain, MIT).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
