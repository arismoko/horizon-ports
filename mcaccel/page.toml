summary = "Shears carve nine new faces into carved pumpkins, jack o'lanterns and soul jack o'lanterns."
description = """
Nine new faces for carved pumpkins, jack o'lanterns and soul jack o'lanterns: an error cross, a smile, a derp, a check mark, a creeper, Herobrine, an evil grin, a heart and a shout.

- Right-click a carved pumpkin or jack o'lantern with shears to carve the next face; after the ninth it goes back to the plain one, and a soul jack o'lantern back to its first face. Left-click with shears in the main hand to go back a face.
- A carved face over a torch crafts its jack o'lantern, and over a soul torch its soul jack o'lantern. A plain soul jack o'lantern is carved back from the first face.
- Wear a carved face on your head and endermen don't notice you looking at them, as with a carved pumpkin.

The blocks come right after the carved pumpkin in the Natural Blocks tab. Install it on the server and the clients.

Differences from the original:

- A carved face or its lantern on top of a golem's body doesn't build the golem ([sunrise-org/sunrise#5397](https://github.com/sunrise-org/sunrise/issues/5397)).
- A snow golem doesn't wear or drop the face it was built with ([sunrise-org/sunrise#5398](https://github.com/sunrise-org/sunrise/issues/5398)).
- Mobs can spawn on the jack o'lanterns, as on vanilla's; the original's can't be spawned on ([sunrise-org/sunrise#5399](https://github.com/sunrise-org/sunrise/issues/5399)).
- Wearing a carved face doesn't blur the view through it ([sunrise-org/sunrise#5405](https://github.com/sunrise-org/sunrise/issues/5405)).
- A carved face equips with a right-click in the air, and a dispenser puts it on a player's head; the original's can't be swapped on and dispensers drop it ([sunrise-org/sunrise#5404](https://github.com/sunrise-org/sunrise/issues/5404)).
- Shears used on a plain soul jack o'lantern do nothing; the original plays the carving sound and then crashes the server.

A port of Minecraft Accelerated by Mari, under CC0-1.0.
"""
categories = ["decoration"]

