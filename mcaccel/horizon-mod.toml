# mcaccel: Minecraft Accelerated 1.0.0 (pumpkinsAccelerated, mari, CC0-1.0). One package with the
# content (data/ and assets/: the content mod mods/mcaccel, carried with tools/carry_jars.py and
# fixed up by tools/mcaccel_port.py; a content package can't use a compiled mod's id) and the rules:
# - mixins `shears_use` (use_pumpkin: shears turn a carved face to the next) and `golem_head` (the
#   mod's pumpkins head golems), with runtime.rs;
# - the worn face's blur is data now: each carved face's block item has vanilla's `equippable`
#   with its own `camera_overlay` (data/mcaccel/horizon/block/carved_pumpkin_*.json; the old
#   bundle's mixin target `screen_quads` has a closure now, which mixins refuse);
# - mixin `left_click` (LeftClickPumpkinEvent: shears turn a face back where the dig starts, only
#   when the game's block_action_restricted allows it), with runtime.rs;
# - src/lib.rs: `enderman_anger` (a worn carved face hides the stare), on the server.
id = "mcaccel"
name = "Minecraft Accelerated"
version = "0.4.1"
description = "Shears carve faces into pumpkins (Minecraft Accelerated 1.0.0 by mari, CC0-1.0)"
authors = []
api = "0.2"
side = "both"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "dd67b76ff23e28c6d8e21859df600d31572f81a0"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "mcaccel"
source = "src/runtime.rs"

# CarvedPumpkinModifier: shears on a pumpkin of the cycle give the next face.
[[native.mixin]]
id = "shears_use"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::pumpkin::Game<'_>::use_pumpkin"
helper = "src/mixins/shears_use.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "at", ty = "[i32; 3]", value = "pos" },
  { name = "side", ty = "[i32; 3]", value = "face" },
  { name = "held", ty = "Option<&ItemStack>", value = "held" },
]

# LeftClickPumpkinEvent: shears' left click turns the face back, after the dig's reach, spawn
# protection and border checks; runtime.rs also asks block_action_restricted (spectator, adventure).
[[native.mixin]]
id = "left_click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::base::Game<'_>::native_left_click_block"
helper = "src/mixins/left_click.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "at", ty = "[i32; 3]", value = "pos" },
  { name = "side", ty = "[i32; 3]", value = "face" },
]

[[native.mixin]]
id = "golem_head"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::golems::Game<'_>::is_golem_head"
helper = "src/mixins/golem_head.rs"
bindings = [
  { name = "game", ty = "&Game<'_>", value = "&*self" },
  { name = "at", ty = "[i32; 3]", value = "p" },
]
