[package]
name = "mod-mcaccel"
version = "0.5.0"
edition = "2024"
license = "CC0-1.0"
description = "Minecraft Accelerated for Sunrise: shears carve faces into pumpkins and jack o'lanterns"
# Ported from: Minecraft Accelerated 1.0.0 (Cookieglue/PumpkinsAccelerated, CC0-1.0).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
