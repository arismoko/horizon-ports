[package]
name = "mod-particlerain"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "Particle Rain for Sunrise: replaces weather effects with particle rain, snow, sandstorms, splashes, ripples, streaks, shrubs, and fog"
# Ported from: Particle Rain (PigCart/particle-rain, MIT).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
